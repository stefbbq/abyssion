name: Deploy
on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Prepare secrets for runtime fallback
        env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          deno eval "const data={MAIL_FROM:Deno.env.get('MAIL_FROM')||'',MAIL_TO:Deno.env.get('MAIL_TO')||'',SENDGRID_API_KEY:Deno.env.get('SENDGRID_API_KEY')||'',SENDGRID_KEY:Deno.env.get('SENDGRID_API_KEY')||''}; await Deno.writeTextFile('secrets.json', JSON.stringify(data));"
          echo "SECRETS_PATH=$GITHUB_WORKSPACE/secrets.json" >> $GITHUB_ENV

      - name: Build step
        run: |
          deno task build:shaders
          deno task build

      - name: Upload to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: "abyssion"
          entrypoint: "main.ts"
          root: "."
          
          
